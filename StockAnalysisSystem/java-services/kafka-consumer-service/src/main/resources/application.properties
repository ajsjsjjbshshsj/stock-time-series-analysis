spring.application.name=kafka-consumer-service
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:stock-analysis-daily-v1}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate

stock.kafka.daily-topic=${STOCK_DAILY_TOPIC:stock.ods.daily.v1}
stock.kafka.dead-letter-topic=${STOCK_DEAD_LETTER_TOPIC:stock.dead-letter.v1}
stock.kafka.supported-schema-version=${STOCK_SUPPORTED_SCHEMA_VERSION:1}
stock.monitor.error-capacity=${STOCK_MONITOR_ERROR_CAPACITY:100}

management.endpoints.web.exposure.include=health,info,metrics
